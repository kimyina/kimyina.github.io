<!doctype html>
<html lang="{{ site.locale | default: 'ko-KR' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="preload" href="{{ '/assets/fonts/PretendardVariable.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/notebook.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <script src="{{ '/assets/js/notebook.js' | relative_url }}" defer></script>
  {% if page.dataset_article %}<link rel="stylesheet" href="{{ '/assets/css/dataset-article.css' | relative_url }}?v={{ site.time | date: '%s' }}"><script src="{{ '/assets/js/dataset-article.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>{% endif %}
  {% if page.dataset_article %}<script src="{{ '/assets/js/scand-player.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>{% endif %}
  {% feed_meta %}
</head>
<body class="notebook-site{% if page.layout == 'home' %} is-home{% endif %}">
  <a class="skip" href="#main">본문으로 건너뛰기</a>
  <header class="notebook-header">
    <a class="signature" href="{{ '/' | relative_url }}" aria-label="전체 글 보기"><span class="signature-orb"><img src="{{ "/assets/images/logo-orb.png" | relative_url }}" alt="" width="48" height="48"></span></a>
    <nav aria-label="주 메뉴">{% for item in site.data.navigation.main %}<a href="{% if item.url contains '://' %}{{ item.url }}{% else %}{{ item.url | relative_url }}{% endif %}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>{% endfor %}</nav>
  </header>
  <div class="site-shell">{% include sidebar.html %}<main id="main" class="site-content">{{ content }}</main></div>
  <footer class="notebook-footer"><div><a href="{{ '/feed.xml' | relative_url }}">RSS</a></div></footer>
</body>
</html>
